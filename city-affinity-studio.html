<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ArtNexus · City Affinity Studio</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/globe.gl"></script>
<style>
:root {
  --bg:#0d0f12; --surface:#141720; --s2:#1c2030; --s3:#232840;
  --border:#2a2e3d; --border2:#3a3f55; --text:#e2e6f0; --muted:#6b7280; --dim:#9ca3af;
  --accent:#6366f1; --accent2:#818cf8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d0f12;color:var(--text);font-family:'DM Sans',system-ui,sans-serif;font-size:13px;line-height:1.5;min-height:100vh;overflow-x:hidden}
#globe-bg{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:0}
.studio-ui{position:relative;z-index:10;max-width:1600px;margin:0 auto;padding:20px;pointer-events:none}
.studio-ui>*{pointer-events:auto}
.city-grid{display:none}

/* glass panels */
header,
.profiles-bar,
.groups-bar,
.stat-card{background:rgba(13,15,18,0.78)!important;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

/* city hover panel */
#city-hover-panel{position:fixed;bottom:28px;left:28px;z-index:400;width:420px;display:none;pointer-events:auto}
#city-hover-panel .city-card{opacity:1!important;filter:none!important;pointer-events:auto;background:rgba(13,15,18,0.92);backdrop-filter:blur(12px)}
#city-hover-panel .city-card.off{opacity:.5!important}
.chp-hint{font-size:10px;color:var(--muted);font-family:'IBM Plex Mono',monospace;margin-top:5px;text-align:center}

/* ── HEADER ── */
header{border:1px solid var(--border);border-radius:10px;padding:14px 20px;margin-bottom:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-size:15px;font-weight:600;color:#818cf8}
.logo span{color:var(--muted)}
.header-sub{font-size:11px;color:var(--muted)}
.header-stat{margin-left:auto;background:var(--s2);border:1px solid var(--border);border-radius:6px;padding:4px 12px;font-size:11px;color:var(--accent2);font-family:'IBM Plex Mono',monospace;font-weight:600}

/* ── PROFILES BAR ── */
.profiles-bar{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin-bottom:10px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.bar-label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;flex-shrink:0;white-space:nowrap;font-family:'IBM Plex Mono',monospace}
.profile-list{display:flex;flex-wrap:wrap;gap:5px;flex:1}
.profile-btn{padding:5px 12px;border-radius:5px;border:1px solid var(--border2);background:var(--s2);color:var(--dim);font-size:12px;cursor:pointer;transition:all .13s;font-family:inherit;display:flex;align-items:baseline;gap:6px}
.profile-btn:hover{border-color:var(--accent2);color:var(--text)}
.profile-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.route-cities{font-size:10px;color:var(--muted);font-family:'IBM Plex Mono',monospace}
.profile-btn.active .route-cities{color:rgba(255,255,255,.6)}
.dim-btn{color:var(--muted);border-color:var(--border)}

/* ── GROUPS + CONFLICTS BAR ── */
.groups-bar{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin-bottom:16px}
.groups-row{display:flex;align-items:center;gap:12px;margin-bottom:9px}
.group-chips{display:flex;flex-wrap:wrap;gap:5px}
.group-chip{padding:4px 12px;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:11px;cursor:pointer;transition:all .13s;font-family:inherit}
.group-chip:hover{border-color:var(--border2);color:var(--dim)}
.group-chip.on{background:var(--s2);border-color:var(--border2);color:var(--text)}
.group-chip.partial{border-color:var(--border2);color:var(--dim);border-style:dashed}
.conflicts-row{display:flex;flex-wrap:wrap;gap:7px}
.conflict-item{display:flex;align-items:stretch;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.conflict-lbl{padding:4px 8px;font-size:9px;font-weight:700;color:var(--muted);background:var(--s3);border-right:1px solid var(--border);display:flex;align-items:center;text-transform:uppercase;letter-spacing:.04em;font-family:'IBM Plex Mono',monospace;white-space:nowrap}
.cseg{padding:4px 10px;font-size:11px;background:transparent;border:none;border-right:1px solid var(--border);color:var(--muted);cursor:pointer;transition:all .13s;white-space:nowrap;font-family:inherit}
.cseg:last-child{border-right:none}
.cseg:hover{background:var(--s2);color:var(--dim)}
.cseg.active{background:var(--s2);color:var(--text);font-weight:600}
.cseg.both-seg.active{background:#f59e0b22;color:#f59e0b}
.cseg.off-seg{font-size:13px;color:var(--border2)}
.cseg.off-seg.active{color:var(--muted);background:transparent}

/* ── VIEW TOGGLE ── */
.view-toggle-wrap{margin-left:auto;display:flex;align-items:center;gap:8px}
.view-toggle-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.view-toggle{display:flex;border:1px solid var(--border2);border-radius:7px;overflow:hidden;background:var(--s3);cursor:pointer}
.view-seg{padding:5px 14px;font-size:11px;font-weight:600;font-family:'IBM Plex Mono',monospace;color:var(--muted);transition:all .12s;border:none;background:transparent;cursor:pointer}
.view-seg.active{background:var(--s2);color:var(--text)}
.view-seg.active.player-seg{background:#6366f1;color:#fff}

/* ── PROFILES BAR — two rows ── */
.profiles-bar{flex-direction:column;gap:8px;align-items:stretch}
.profiles-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.style-btn.active{background:#d97706;border-color:#d97706;color:#fff}

/* ── STATS ── */
.stats-row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 14px;flex:1;min-width:120px;cursor:pointer;position:relative;transition:border-color .13s;user-select:none}
.stat-card:hover{border-color:var(--border2)}
.stat-card.open{border-color:var(--accent2)}
.stat-num{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600;color:var(--accent2)}
.stat-label{font-size:10px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.3px;display:flex;align-items:center;gap:4px}
.stat-label::after{content:'▾';font-size:9px;opacity:.4}
.stat-card.open .stat-label::after{content:'▴';opacity:.8}
.stat-dropdown{position:absolute;top:calc(100% + 5px);left:0;min-width:240px;max-width:400px;background:var(--s2);border:1px solid var(--border2);border-radius:8px;padding:11px 13px;z-index:200;display:none;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.stat-card.open .stat-dropdown{display:block}
.drop-section{margin-bottom:9px}
.drop-section:last-child{margin-bottom:0}
.drop-title{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px;font-family:'IBM Plex Mono',monospace}
.drop-tags{display:flex;flex-wrap:wrap;gap:3px}
.drop-tag{padding:2px 7px;border-radius:3px;font-size:10px;font-weight:600}
.drop-cities{display:flex;flex-wrap:wrap;gap:5px 10px}
.drop-city{font-size:11px;color:var(--dim);display:flex;align-items:center;gap:3px;white-space:nowrap}
.drop-rows{display:flex;flex-direction:column;gap:4px}
.drop-row{display:flex;align-items:baseline;gap:8px;font-size:11px}
.drop-row-val{font-family:'IBM Plex Mono',monospace;color:var(--accent2);flex-shrink:0}
.drop-row-cities{color:var(--dim);flex:1;flex-wrap:wrap}

/* ── CITY GRID ── */
.city-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}

/* ── CITY CARD ── */
.city-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;transition:opacity .2s,filter .2s,border-color .2s}
.city-card.off{opacity:.25;filter:grayscale(.9);pointer-events:none}
.city-card.db-city{border-color:#6366f133}

.city-header{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.city-flag{font-size:22px;line-height:1}
.city-name{font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
.city-db-tag{font-size:9px;font-family:'IBM Plex Mono',monospace;font-weight:600;padding:1px 5px;border-radius:3px;background:#6366f122;color:#818cf8;border:1px solid #6366f133}
.city-sub{font-size:11px;color:var(--muted)}

/* ── CARD BODY: two-column layout ── */
.city-body{display:flex;min-height:118px}

/* ── AFFINITIES — left column ── */
.affinity-list{flex:0 0 52%;padding:10px 12px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--border)}
.affinity-pill{display:flex;justify-content:space-between;align-items:center;padding:4px 9px;border-radius:4px;gap:6px}
.affinity-pill-tag{font-size:11px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.affinity-pill-mult{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;flex-shrink:0;transition:opacity .2s,width .2s}

/* ── STRATEGY — right column, curator always visible ── */
.city-strategy{flex:1;padding:10px 14px;font-size:11px;color:var(--muted);line-height:1.65;overflow:auto}
.city-strategy strong{color:var(--dim)}
.strategy-curator{}
.strategy-lore{display:none;font-size:11px;color:var(--dim);line-height:1.7}

/* ══════════════════════════════════════════
   PLAYER MODE
══════════════════════════════════════════ */
.player-mode .affinity-pill-mult{opacity:0;pointer-events:none;width:0;min-width:0;overflow:hidden}
.player-mode .city-card:not(.off):hover{
  border-color:var(--border2);
  box-shadow:0 0 0 1px var(--accent)22;
}
.player-mode .strategy-curator{display:none}
.player-mode .strategy-lore{display:block}
.curator-mode .strategy-lore{display:none}
.curator-mode .strategy-curator{display:block}

/* Hint bar visible in player mode */
.player-hint{display:none;text-align:center;font-size:10px;color:var(--muted);padding:6px;font-family:'IBM Plex Mono',monospace;letter-spacing:.3px;margin-bottom:4px}
.player-mode .player-hint{display:block}
</style>
</head>
<body class="curator-mode">
<div id="globe-bg"></div>
<div id="city-hover-panel"></div>
<div class="studio-ui">

<header>
  <div class="logo">ArtNexus <span>·</span> City Affinity Studio</div>
  <div class="header-sub">Choose cities per region — conflicts resolved inline</div>
  <div class="header-stat" id="header-stat">— active</div>
</header>

<!-- PROFILES -->
<div class="profiles-bar">
  <div class="profiles-row">
    <span class="bar-label">Region</span>
    <div class="profile-list">
      <button class="profile-btn active" id="pbtn-core"         onclick="applyPreset('core',this)">Core Coverage</button>
      <button class="profile-btn route-btn" id="pbtn-routeA"   onclick="applyPreset('routeA',this)">Route A <span class="route-cities">Amst · Cairo · SP · Tokyo · Beijing</span></button>
      <button class="profile-btn route-btn" id="pbtn-routeB"   onclick="applyPreset('routeB',this)">Route B <span class="route-cities">Bruss · Istanbul · MXC · Kyoto · Shanghai</span></button>
      <button class="profile-btn" id="pbtn-western"            onclick="applyPreset('western',this)">W. Europe</button>
      <button class="profile-btn" id="pbtn-eastasia"           onclick="applyPreset('eastasia',this)">East Asia</button>
      <button class="profile-btn" id="pbtn-americas"           onclick="applyPreset('americas',this)">Americas</button>
      <button class="profile-btn" id="pbtn-all"                onclick="applyPreset('all',this)">Global</button>
      <button class="profile-btn dim-btn" id="pbtn-none"       onclick="applyPreset('none',this)">Clear</button>
    </div>
    <div class="view-toggle-wrap">
      <span class="view-toggle-label">View</span>
      <div class="view-toggle">
        <button class="view-seg active" id="seg-curator" onclick="setView('curator')">Curator</button>
        <button class="view-seg player-seg" id="seg-player" onclick="setView('player')">Player</button>
      </div>
    </div>
  </div>
  <div class="profiles-row">
    <span class="bar-label">Style</span>
    <div class="profile-list">
      <button class="profile-btn style-btn" id="pbtn-impressionist" onclick="applyPreset('impressionist',this)">Impressionist Circuit</button>
      <button class="profile-btn style-btn" id="pbtn-classical"     onclick="applyPreset('classical',this)">Ancient Worlds</button>
      <button class="profile-btn style-btn" id="pbtn-baroque"       onclick="applyPreset('baroque',this)">The Golden Age</button>
      <button class="profile-btn style-btn" id="pbtn-avantgarde"    onclick="applyPreset('avantgarde',this)">The Modern Break</button>
      <button class="profile-btn style-btn" id="pbtn-contemporary"  onclick="applyPreset('contemporary',this)">Contemporary Beat</button>
    </div>
  </div>
</div>

<!-- GROUPS + CONFLICTS -->
<div class="groups-bar">
  <div class="groups-row">
    <span class="bar-label">Groups</span>
    <div class="group-chips" id="group-chips"></div>
  </div>
  <div class="conflicts-row" id="conflicts-row"></div>
</div>

<!-- STATS -->
<div class="stats-row">
  <div class="stat-card" onclick="toggleStatDrop(this)">
    <div class="stat-num" id="s-active">—</div>
    <div class="stat-label">Active cities</div>
    <div class="stat-dropdown" id="drop-active"></div>
  </div>
  <div class="stat-card" onclick="toggleStatDrop(this)">
    <div class="stat-num" id="s-tags">—</div>
    <div class="stat-label">Affinity tags</div>
    <div class="stat-dropdown" id="drop-tags"></div>
  </div>
  <div class="stat-card" onclick="toggleStatDrop(this)">
    <div class="stat-num" id="s-maxmult">—</div>
    <div class="stat-label">Max stack</div>
    <div class="stat-dropdown" id="drop-maxmult"></div>
  </div>
  <div class="stat-card" onclick="toggleStatDrop(this)">
    <div class="stat-num" id="s-coverage">—</div>
    <div class="stat-label">Regions covered</div>
    <div class="stat-dropdown" id="drop-coverage"></div>
  </div>
</div>

<!-- HINT -->
<div class="player-hint">hover any city to learn its character</div>

<!-- CITY CARDS -->
<div class="city-grid" id="city-grid"></div>

</div><!-- /.studio-ui -->
<script>
// ══════════════════════════════════════════════════════════════════
//  CITY DATA
//  strategy = curator text (institutional, precise)
//  lore     = player text (evocative, no numbers, museums as places)
// ══════════════════════════════════════════════════════════════════
const CITIES = [

  // ─ FRANCE ───────────────────────────────────────────────────────
  {id:'paris', name:'Paris', flag:'🇫🇷', sub:"Musée d'Orsay · Louvre · Centre Pompidou",
   region:'France', status:'core',
   affinities:[
     {tag:'French',             mult:2.0, color:'#3b82f6'},
     {tag:'Impressionism',      mult:2.0, color:'#8b5cf6'},
     {tag:'Post-Impressionism', mult:1.8, color:'#a855f7'},
     {tag:'Art Nouveau',        mult:1.7, color:'#c084fc'},
     {tag:'Rococo',             mult:1.6, color:'#ddd6fe'},
   ],
   strategy:"French and Impressionist tags stack at maximum strength here. Monet, Renoir, Pissarro, Cézanne — works carrying French identity or the Impressionist gesture score at the top of the system. The Musée d'Orsay holds the world's deepest Impressionist collection; the Louvre anchors five centuries of French painting before it.",
   lore:"The city set the terms for two centuries of Western painting, and then the Impressionists rewrote them in a single decade — and Paris recognized it first. The Louvre holds what came before; the Musée d'Orsay holds the moment it changed."},

  // ─ ITALY ────────────────────────────────────────────────────────
  {id:'rome', name:'Rome', flag:'🇮🇹', sub:'Vatican Museums · Borghese · Capitoline',
   region:'Italy', status:'core',
   affinities:[
     {tag:'Italian',            mult:2.0, color:'#f59e0b'},
     {tag:'Renaissance',        mult:2.0, color:'#fbbf24'},
     {tag:'Baroque',            mult:1.9, color:'#fcd34d'},
     {tag:'Mannerism',          mult:1.7, color:'#fde68a'},
     {tag:'Neoclassical',       mult:1.6, color:'#fef3c7'},
   ],
   strategy:"Italian and Renaissance tags reach maximum strength here simultaneously. Raphael, Michelangelo, Caravaggio — works carrying Italian identity across any period score above anywhere else. The Vatican Museums and Borghese Gallery define the institutional canon; the Capitoline holds the oldest public collection in the world.",
   lore:"Every major Western painter from the 1400s onward came here on commission or came to study the ruins. The Vatican spent a century hiring the best painters alive to cover its ceilings and walls. Work carrying this tradition arrives in the city that wrote the original brief."},

  // ─ IBERIA ────────────────────────────────────────────────────────
  {id:'madrid', name:'Madrid', flag:'🇪🇸', sub:'Prado · Reina Sofía · Thyssen-Bornemisza',
   region:'Iberia', status:'core',
   affinities:[
     {tag:'Spanish',            mult:2.0, color:'#dc2626'},
     {tag:'Baroque',            mult:1.9, color:'#ef4444'},
     {tag:'Surrealism',         mult:1.8, color:'#f87171'},
     {tag:'Velázquez-era',      mult:1.7, color:'#fca5a5'},
     {tag:'Goya',               mult:1.8, color:'#fed7aa'},
   ],
   strategy:"Spanish identity tags reach maximum strength here. Velázquez painted the king; Goya painted the nightmares; Dalí painted the space between. Works carrying Spanish origin, Baroque character, or Surrealist movement score at full strength across all three of Madrid's anchor institutions — the Prado, Reina Sofía, and Thyssen.",
   lore:"Velázquez painted the royal family with such unflattering precision the king made him court painter anyway. Goya painted his nightmares on the walls of his own house, for no audience. Both painters are still in the Prado, a fifteen-minute walk apart."},

  // ─ BENELUX ───────────────────────────────────────────────────────
  {id:'amsterdam', name:'Amsterdam', flag:'🇳🇱', sub:'Rijksmuseum · Van Gogh Museum · Stedelijk',
   region:'Benelux', status:'core', group:'benelux', dbCity:true, dbLabel:'RIJKS',
   affinities:[
     {tag:'Dutch',              mult:2.0, color:'#f97316'},
     {tag:'Golden Age',         mult:2.0, color:'#fb923c'},
     {tag:'Flemish',            mult:1.8, color:'#fdba74'},
     {tag:'Baroque',            mult:1.6, color:'#fde68a'},
   ],
   strategy:"Dutch and Golden Age tags reach maximum strength simultaneously — the highest possible double-stack for any single national tradition in the system. The Rijksmuseum, one of our eight primary collection sources, holds the world's deepest Dutch Golden Age holdings. Rembrandt, Vermeer, Hals, de Hooch — works carrying Dutch identity score here above anywhere else on earth.",
   lore:"The Dutch Republic had no king and no church with money to spend, so merchant families commissioned portraits of themselves instead — the first civilization to make ordinary life the subject of serious painting. The Rijksmuseum, one of our primary collection sources, holds all of it."},

  {id:'brussels', name:'Brussels', flag:'🇧🇪', sub:'Royal Museums of Fine Arts · Magritte Museum · BOZAR',
   region:'Benelux', status:'expanded', group:'benelux',
   affinities:[
     {tag:'Belgian',            mult:1.9, color:'#f59e0b'},
     {tag:'Flemish',            mult:1.8, color:'#fbbf24'},
     {tag:'Surrealism',         mult:2.0, color:'#fcd34d'},
     {tag:'Symbolism',          mult:1.8, color:'#fde68a'},
   ],
   strategy:"Belgian Surrealism reaches maximum strength exclusively here — Magritte's practice belongs to this city in a way no other movement belongs to any city. The Flemish overlap with Amsterdam is real but secondary; Brussels' primary identity is Symbolism and Surrealism. The Magritte Museum holds the largest collection of his work anywhere.",
   lore:"Magritte commuted to his studio by tram and painted the surreal as if it were perfectly ordinary — which is a different thing than the Spanish heat of Dalí, or the Freudian drama of Ernst. The polite uncanny, the wrong thing in an entirely reasonable room, is specifically Belgian."},

  // ─ GERMAN-SPEAKING ───────────────────────────────────────────────
  {id:'berlin', name:'Berlin', flag:'🇩🇪', sub:'Gemäldegalerie · Neue Nationalgalerie · Pergamon',
   region:'German-speaking', status:'core',
   affinities:[
     {tag:'German',             mult:1.9, color:'#6b7280'},
     {tag:'Expressionism',      mult:2.0, color:'#9ca3af'},
     {tag:'Bauhaus',            mult:1.9, color:'#d1d5db'},
     {tag:'New Objectivity',    mult:1.8, color:'#e5e7eb'},
     {tag:'Romanticism',        mult:1.6, color:'#f3f4f6'},
   ],
   strategy:"German Expressionism reaches maximum strength here, stacking with German national identity for works that carry both. Kirchner, Klee, Grosz, Beckmann — the full Expressionist and Weimar canon peaks in Berlin. Bauhaus tags are also near-exclusive to this city. Harvard's Busch-Reisinger Museum, our primary Expressionist source, directly feeds this affinity.",
   lore:"Kirchner painted the Berlin streets in 1913 with an electric urgency — the city already moving faster than anyone could quite capture. The Bauhaus was founded in 1919 on the conviction that good design could rebuild civilization, and in the thirteen years it ran, it changed how the world thinks about making things."},

  {id:'vienna', name:'Vienna', flag:'🇦🇹', sub:'Kunsthistorisches Museum · Belvedere · Leopold Museum',
   region:'German-speaking', status:'expanded',
   affinities:[
     {tag:'Austrian',           mult:1.9, color:'#f97316'},
     {tag:'Art Nouveau',        mult:2.0, color:'#fb923c'},
     {tag:'Vienna Secession',   mult:2.0, color:'#fdba74'},
     {tag:'Symbolism',          mult:1.8, color:'#fde68a'},
     {tag:'Habsburg',           mult:1.7, color:'#fed7aa'},
   ],
   strategy:"Vienna Secession tags reach maximum strength exclusively here — this movement has no other home in the system. Klimt and Schiele are both singular to Vienna; the Belvedere holds the world's largest Klimt collection. The Kunsthistorisches holds four centuries of Habsburg accumulation. Works carrying Austrian identity, Art Nouveau character, or Symbolist movement score here at full strength.",
   lore:"The Secession's founding motto was 'to every age its art, to every art its freedom' — which the Habsburg court funded against its own instincts, because they recognized something irreplaceable was happening. Klimt and Schiele worked within a decade of each other and produced almost nothing in common."},

  // ─ BRITISH ISLES ──────────────────────────────────────────────────
  {id:'london', name:'London', flag:'🇬🇧', sub:'National Gallery · Tate Modern · Victoria & Albert Museum',
   region:'British Isles', status:'core',
   affinities:[
     {tag:'British',            mult:1.9, color:'#10b981'},
     {tag:'Pre-Raphaelite',     mult:1.9, color:'#34d399'},

//  REGION GROUPS  (geographic cluster chips)
// ══════════════════════════════════════════════════════════════════
const REGION_GROUPS = [
  {id:'weurope',  label:'W. Europe',   solos:['paris','rome','madrid','berlin','vienna','london','stockholm','athens']},
  {id:'russia',   label:'Russia',      solos:['moscow']},
  {id:'gulf',     label:'Gulf',        solos:['abu-dhabi']},
  {id:'africa',   label:'Africa',      solos:['dakar']},
  {id:'india',    label:'India',       solos:['delhi']},
  {id:'americas', label:'Americas',    solos:['new-york','washington','los-angeles']},
  {id:'korea',    label:'Korea',       solos:['seoul']},
  {id:'pacific',  label:'Pacific',     solos:['sydney']},
];

// ══════════════════════════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════════════════════════
let soloActive = new Set(['paris','rome','madrid','berlin','london','moscow','new-york','washington','athens','abu-dhabi','dakar','delhi']);
let viewMode = 'curator'; // 'curator' | 'player'

function activeCityIds() {
  const ids = new Set(soloActive);
  for (const g of Object.values(GROUPS)) {
    if (g.state === 'a' || g.state === 'both') ids.add(g.a);
    if (g.state === 'b' || g.state === 'both') ids.add(g.b);
  }
  return ids;
}

// ══════════════════════════════════════════════════════════════════
//  VIEW TOGGLE
// ══════════════════════════════════════════════════════════════════
function setView(mode) {
  viewMode = mode;
  document.body.className = mode === 'player' ? 'player-mode' : 'curator-mode';
  document.getElementById('seg-curator').classList.toggle('active', mode === 'curator');
  document.getElementById('seg-player').classList.toggle('active', mode === 'player');
}

// ══════════════════════════════════════════════════════════════════
//  SELECTOR BUILDER
// ══════════════════════════════════════════════════════════════════
function buildSelector() {
  // Group chips
  document.getElementById('group-chips').innerHTML = REGION_GROUPS.map(grp => {
    const allOn  = grp.solos.every(s => soloActive.has(s));
    const anyOn  = grp.solos.some(s => soloActive.has(s));
    const cls    = allOn ? 'on' : anyOn ? 'partial' : '';
    return `<button class="group-chip ${cls}" onclick="toggleGroup('${grp.id}')">${grp.label}</button>`;
  }).join('');

  // Conflict selectors
  document.getElementById('conflicts-row').innerHTML = Object.entries(GROUPS).map(([gid, g]) => {
    const ca = CITIES.find(c => c.id === g.a);
    const cb = CITIES.find(c => c.id === g.b);
    return `<div class="conflict-item">
      <span class="conflict-lbl">${g.label}</span>
      <button class="cseg ${g.state==='a'?'active':''}"    onclick="setGroup('${gid}','a')">${ca.flag} ${ca.name}</button>
      <button class="cseg both-seg ${g.state==='both'?'active':''}" onclick="setGroup('${gid}','both')">Both ⚠</button>
      <button class="cseg ${g.state==='b'?'active':''}"    onclick="setGroup('${gid}','b')">${cb.flag} ${cb.name}</button>
      <button class="cseg off-seg ${g.state==='none'?'active':''}" onclick="setGroup('${gid}','none')">—</button>
    </div>`;
  }).join('');
}

function toggleGroup(id) {
  const grp = REGION_GROUPS.find(g => g.id === id);
  if (!grp) return;
  const allOn = grp.solos.every(s => soloActive.has(s));
  grp.solos.forEach(s => allOn ? soloActive.delete(s) : soloActive.add(s));
  clearActiveProfile();
  render();
}

// ══════════════════════════════════════════════════════════════════
//  CARD RENDERER
// ══════════════════════════════════════════════════════════════════
function renderCards() {
  const active = activeCityIds();
  const grid = document.getElementById('city-grid');

  const sorted = [...CITIES].sort((a,b) => {
    const aOn = active.has(a.id) ? 0 : 1;
    const bOn = active.has(b.id) ? 0 : 1;
    return aOn - bOn;
  });

  grid.innerHTML = sorted.map(city => {
    const on = active.has(city.id);
    const topAffinities = [...city.affinities].sort((a,b) => b.mult - a.mult).slice(0, 5);

    const affinityRows = topAffinities.map(a => {
      return `<div class="affinity-pill" style="background:${a.color}1a;">
        <span class="affinity-pill-tag" style="color:${a.color}">${a.tag}</span>
        <span class="affinity-pill-mult" style="color:${a.color}">${a.mult.toFixed(1)}×</span>
      </div>`;
    }).join('');

    const dbTag = city.dbCity ? `<span class="city-db-tag">${city.dbLabel}</span>` : '';

    return `<div class="city-card ${on?'':'off'} ${city.dbCity?'db-city':''}" id="card-${city.id}">
      <div class="city-header">
        <div class="city-flag">${city.flag}</div>
        <div>
          <div class="city-name">${city.name} ${dbTag}</div>
          <div class="city-sub">${city.sub}</div>
        </div>
      </div>
      <div class="city-body">
        <div class="affinity-list">${affinityRows}</div>
        <div class="city-strategy">
          <span class="strategy-curator"><strong>Strategy:</strong> ${city.strategy}</span>
          <span class="strategy-lore">${city.lore}</span>
        </div>
      </div>
    </div>`;
  }).join('');

  updateStats(active);
}

function updateStats(active) {
  const activeCities = CITIES.filter(c => active.has(c.id));

  // tag color map from all cities
  const tagColor = {};
  CITIES.forEach(c => c.affinities.forEach(a => { if (!tagColor[a.tag]) tagColor[a.tag] = a.color; }));

  const allTags    = new Set(CITIES.flatMap(c => c.affinities.map(a => a.tag)));
  const activeTags = new Set(activeCities.flatMap(c => c.affinities.map(a => a.tag)));
  const unusedTags = [...allTags].filter(t => !activeTags.has(t)).sort();
  const maxMult    = Math.max(...activeCities.flatMap(c => c.affinities.map(a => a.mult)), 0);
  const regions    = new Set(activeCities.map(c => c.region));
  const allRegions = [...new Set(CITIES.map(c => c.region))];

  document.getElementById('s-active').textContent   = active.size + ' / ' + CITIES.length;
  document.getElementById('s-tags').textContent     = activeTags.size + ' / ' + allTags.size;
  document.getElementById('s-maxmult').textContent  = maxMult ? maxMult.toFixed(1)+'×' : '—';
  document.getElementById('s-coverage').textContent = regions.size + ' / ' + allRegions.length;
  document.getElementById('header-stat').textContent = active.size+' / '+CITIES.length+' cities active';

  const inactiveCities = CITIES.filter(c => !active.has(c.id));

  // ── Drop 1: active + inactive cities ──
  document.getElementById('drop-active').innerHTML = `
    <div class="drop-section">
      <div class="drop-title">Active (${activeCities.length})</div>
      <div class="drop-cities">${activeCities.map(c =>
        `<span class="drop-city"><span>${c.flag}</span>${c.name}</span>`
      ).join('')}</div>
    </div>
    <div class="drop-section">
      <div class="drop-title" style="color:var(--muted)">Inactive (${inactiveCities.length})</div>
      <div class="drop-cities">${inactiveCities.map(c =>
        `<span class="drop-city" style="opacity:.45"><span>${c.flag}</span>${c.name}</span>`
      ).join('')}</div>
    </div>`;

  // ── Drop 2: tags used + unused ──
  const activeTagsSorted = [...activeTags].sort();
  document.getElementById('drop-tags').innerHTML = `
    <div class="drop-section">
      <div class="drop-title">Active tags (${activeTags.size})</div>
      <div class="drop-tags">${activeTagsSorted.map(t =>
        `<span class="drop-tag" style="background:${tagColor[t]}22;color:${tagColor[t]}">${t}</span>`
      ).join('')}</div>
    </div>
    ${unusedTags.length ? `<div class="drop-section">
      <div class="drop-title">Not covered (${unusedTags.length})</div>
      <div class="drop-tags">${unusedTags.map(t =>
        `<span class="drop-tag" style="background:var(--s3);color:var(--muted)">${t}</span>`
      ).join('')}</div>
    </div>` : '<div class="drop-section"><div class="drop-title" style="color:var(--accent2)">All tags covered ✓</div></div>'}`;

  // ── Drop 3: max stack — cities grouped by top multiplier ──
  const byMult = {};
  activeCities.forEach(c => {
    const best = Math.max(...c.affinities.map(a => a.mult));
    const key  = best.toFixed(1)+'×';
    if (!byMult[key]) byMult[key] = [];
    byMult[key].push(c);
  });
  const multEntries = Object.entries(byMult).sort((a,b) => parseFloat(b[0]) - parseFloat(a[0]));
  document.getElementById('drop-maxmult').innerHTML = `
    <div class="drop-section">
      <div class="drop-title">Cities by peak multiplier</div>
      <div class="drop-rows">${multEntries.map(([mult, cities]) =>
        `<div class="drop-row">
          <span class="drop-row-val">${mult}</span>
          <span class="drop-row-cities">${cities.map(c => c.flag+' '+c.name).join(' · ')}</span>
        </div>`
      ).join('')}</div>
    </div>`;

  // ── Drop 4: regions covered / uncovered ──
  const coveredRegions   = allRegions.filter(r => regions.has(r));
  const uncoveredRegions = allRegions.filter(r => !regions.has(r));
  document.getElementById('drop-coverage').innerHTML = `
    <div class="drop-section">
      <div class="drop-title">Covered (${coveredRegions.length})</div>
      <div class="drop-tags">${coveredRegions.map(r =>
        `<span class="drop-tag" style="background:var(--s2);color:var(--dim)">${r}</span>`
      ).join('')}</div>
    </div>
    ${uncoveredRegions.length ? `<div class="drop-section">
      <div class="drop-title">Not active (${uncoveredRegions.length})</div>
      <div class="drop-tags">${uncoveredRegions.map(r =>
        `<span class="drop-tag" style="background:transparent;color:var(--muted);border:1px dashed var(--border)">${r}</span>`
      ).join('')}</div>
    </div>` : ''}`;
}

function toggleStatDrop(card) {
  const wasOpen = card.classList.contains('open');
  document.querySelectorAll('.stat-card').forEach(c => c.classList.remove('open'));
  if (!wasOpen) card.classList.add('open');
}
document.addEventListener('click', e => {
  if (!e.target.closest('.stat-card'))
    document.querySelectorAll('.stat-card').forEach(c => c.classList.remove('open'));
});

// ══════════════════════════════════════════════════════════════════
//  EVENTS
// ══════════════════════════════════════════════════════════════════
function clearActiveProfile() {
  document.querySelectorAll('.profile-btn').forEach(b => b.classList.remove('active'));
}
function setGroup(gid, state) {
  GROUPS[gid].state = state;
  clearActiveProfile();
  render();
}
function applyPreset(key, btn) {
  const p = PRESETS[key];
  if (!p) return;
  soloActive = new Set(p.solos);
  for (const [gid, state] of Object.entries(p.groups)) {
    if (GROUPS[gid]) GROUPS[gid].state = state;
  }
  clearActiveProfile();
  btn.classList.add('active');
  render();
}
function render() {
  buildSelector();
  renderCards();
  updateGlobe();
}

render();

// ══════════════════════════════════════════════════════════════════
//  GLOBE
// ══════════════════════════════════════════════════════════════════
const CITY_COORDS = {
  'paris':       {lat:48.8566, lng:2.3522},
  'rome':        {lat:41.9028, lng:12.4964},
  'madrid':      {lat:40.4168, lng:-3.7038},
  'amsterdam':   {lat:52.3676, lng:4.9041},
  'brussels':    {lat:50.8503, lng:4.3517},
  'berlin':      {lat:52.5200, lng:13.4050},
  'vienna':      {lat:48.2082, lng:16.3738},
  'london':      {lat:51.5074, lng:-0.1278},
  'stockholm':   {lat:59.3293, lng:18.0686},
  'athens':      {lat:37.9838, lng:23.7275},
  'moscow':      {lat:55.7558, lng:37.6173},
  'cairo':       {lat:30.0444, lng:31.2357},
  'istanbul':    {lat:41.0082, lng:28.9784},
  'abu-dhabi':   {lat:24.4539, lng:54.3773},
  'dakar':       {lat:14.7167, lng:-17.4677},
  'delhi':       {lat:28.6139, lng:77.2090},
  'new-york':    {lat:40.7128, lng:-74.0060},
  'washington':  {lat:38.9072, lng:-77.0369},
  'los-angeles': {lat:34.0522, lng:-118.2437},
  'mexico-city': {lat:19.4326, lng:-99.1332},
  'sao-paulo':   {lat:-23.5505, lng:-46.6333},
  'tokyo':       {lat:35.6762, lng:139.6503},
  'kyoto':       {lat:35.0116, lng:135.7681},
  'beijing':     {lat:39.9042, lng:116.4074},
  'shanghai':    {lat:31.2304, lng:121.4737},
  'seoul':       {lat:37.5665, lng:126.9780},
  'sydney':      {lat:-33.8688, lng:151.2093},
};

let globeInstance = null;

function renderCityCard(city) {
  const active = activeCityIds();
  const on = active.has(city.id);
  const topAffinities = [...city.affinities].sort((a,b) => b.mult - a.mult).slice(0, 5);
  const affinityRows = topAffinities.map(a =>
    `<div class="affinity-pill" style="background:${a.color}1a;">
      <span class="affinity-pill-tag" style="color:${a.color}">${a.tag}</span>
      <span class="affinity-pill-mult" style="color:${a.color}">${a.mult.toFixed(1)}×</span>
    </div>`
  ).join('');
  const dbTag = city.dbCity ? `<span class="city-db-tag">${city.dbLabel}</span>` : '';
  return `<div class="city-card ${on?'':'off'} ${city.dbCity?'db-city':''}">
    <div class="city-header">
      <div class="city-flag">${city.flag}</div>
      <div>
        <div class="city-name">${city.name} ${dbTag}</div>
        <div class="city-sub">${city.sub}</div>
      </div>
    </div>
    <div class="city-body">
      <div class="affinity-list">${affinityRows}</div>
      <div class="city-strategy">
        <span class="strategy-curator"><strong>Strategy:</strong> ${city.strategy}</span>
        <span class="strategy-lore">${city.lore}</span>
      </div>
    </div>
  </div>`;
}

function showCityPanel(city) {
  const panel = document.getElementById('city-hover-panel');
  if (!city) { panel.style.display = 'none'; return; }
  const active = activeCityIds().has(city.id);
  panel.innerHTML = renderCityCard(city) +
    `<div class="chp-hint">${active ? 'click globe dot to deactivate' : 'click globe dot to activate'}</div>`;
  panel.style.display = 'block';
}

function initGlobe() {
  const el = document.getElementById('globe-bg');
  if (!el || typeof Globe === 'undefined') return;

  const citiesWithCoords = CITIES.filter(c => CITY_COORDS[c.id]);

  globeInstance = new Globe(el)
    .globeImageUrl('https://cdn.jsdelivr.net/npm/three-globe/example/img/earth-topology.png')
    .backgroundColor('rgba(0,0,0,1)')
    .atmosphereColor('#6366f1')
    .atmosphereAltitude(0.12)
    .pointsData(citiesWithCoords)
    .pointLat(d => CITY_COORDS[d.id].lat)
    .pointLng(d => CITY_COORDS[d.id].lng)
    .pointColor(d => activeCityIds().has(d.id) ? '#818cf8' : '#334155')
    .pointRadius(d => activeCityIds().has(d.id) ? 0.55 : 0.28)
    .pointAltitude(0.01)
    .pointResolution(8)
    .onPointClick(d => {
      const inGroup = Object.entries(GROUPS).find(([,g]) => g.a === d.id || g.b === d.id);
      if (inGroup) {
        const [, g] = inGroup;
        const side = g.a === d.id ? 'a' : 'b';
        const other = side === 'a' ? 'b' : 'a';
        if      (g.state === side)   g.state = 'none';
        else if (g.state === 'none') g.state = side;
        else if (g.state === other)  g.state = 'both';
        else                         g.state = 'none';
      } else {
        soloActive.has(d.id) ? soloActive.delete(d.id) : soloActive.add(d.id);
      }
      clearActiveProfile();
      render();
    })
    .onPointHover(d => showCityPanel(d || null));

  globeInstance.controls().autoRotate = true;
  globeInstance.controls().autoRotateSpeed = 0.25;

  const resize = () => {
    if (globeInstance && el.clientWidth > 0) {
      globeInstance.width(window.innerWidth).height(window.innerHeight);
    }
  };
  window.addEventListener('resize', resize);
  [100, 500, 1000].forEach(t => setTimeout(resize, t));
}

function updateGlobe() {
  if (!globeInstance) return;
  const active = activeCityIds();
  const citiesWithCoords = CITIES.filter(c => CITY_COORDS[c.id]);

  globeInstance
    .pointColor(d => active.has(d.id) ? '#818cf8' : '#2d3748')
    .pointRadius(d => active.has(d.id) ? 0.55 : 0.28);

  // Arcs: all active city pairs, capped at 120 for performance
  const activeList = citiesWithCoords.filter(c => active.has(c.id));
  const arcs = [];
  for (let i = 0; i < activeList.length && arcs.length < 120; i++)
    for (let j = i+1; j < activeList.length; j++)
      arcs.push({src: activeList[i], dst: activeList[j]});

  globeInstance
    .arcsData(arcs)
    .arcStartLat(d => CITY_COORDS[d.src.id].lat)
    .arcStartLng(d => CITY_COORDS[d.src.id].lng)
    .arcEndLat(d => CITY_COORDS[d.dst.id].lat)
    .arcEndLng(d => CITY_COORDS[d.dst.id].lng)
    .arcColor(() => 'rgba(99,102,241,0.07)')
    .arcStroke(0.25)
    .arcDashLength(0.6)
    .arcDashGap(0.4)
    .arcDashAnimateTime(3500);
}

// Init globe after a short delay to let DOM settle
setTimeout(initGlobe, 200);
</script>
